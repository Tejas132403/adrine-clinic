databases:
  - name: clinic-postgres
    databaseName: clinic_management
    user: clinic_user
    plan: free

services:
  - type: web
    name: clinic-management
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
